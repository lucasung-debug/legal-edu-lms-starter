<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>처음 설정 — 법정필수교육 LMS</title>
<link rel="stylesheet" href="/app.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(1200px 600px at 10% -10%, #dfe7ff 0%, transparent 60%), var(--bg); }
  .wizard { width: min(520px, 100%); padding: 32px; display: grid; gap: 18px; }
  .wizard h1 { margin: 0 0 4px; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .steps i { height: 6px; border-radius: 999px; background: #e3e7ef; }
  .steps i.on { background: var(--primary); }
  .pane { display: grid; gap: 14px; }
  .choice { display: grid; grid-template-columns: 20px 1fr; gap: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-weight: 500; }
  .choice:has(input:checked) { border-color: var(--primary); background: var(--primary-weak); }
  .choice input { width: auto; margin-top: 3px; }
  .choice b { display: block; }
  .acts { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
<form class="card wizard" id="f" novalidate>
  <div class="brand"><div class="brand-mark">法</div><span>법정필수교육 LMS</span></div>
  <div class="steps" aria-hidden="true"><i class="on"></i><i></i><i></i></div>

  <div class="pane" data-step="0">
    <div><h1>회사 정보를 알려 주세요</h1><p class="muted" style="margin:0">수료증에 이 이름으로 들어갑니다. 나중에 설정에서 바꿀 수 있습니다.</p></div>
    <label class="field">회사명 *<input name="company_name" placeholder="예: (주)○○컴퍼니" autocomplete="organization"></label>
    <label class="field">대표이사 성명 *<input name="ceo_name" placeholder="예: 홍길동"></label>
    <label class="field">교육 문의처<span class="hint">교육생에게 보내는 안내에 표시됩니다</span><input name="manager_contact" placeholder="예: 인사팀 02-000-0000"></label>
  </div>

  <div class="pane hidden" data-step="1">
    <div><h1>관리자 비밀번호를 정해 주세요</h1><p class="muted" style="margin:0">HR 담당자가 교육을 관리할 때 쓰는 계정입니다. 아이디는 <b>admin</b>으로 고정됩니다.</p></div>
    <label class="field">비밀번호 *<span class="hint">영문 + 숫자 포함 8자 이상</span><input type="password" name="password" autocomplete="new-password"></label>
    <label class="field">비밀번호 확인 *<input type="password" name="confirm" autocomplete="new-password"></label>
    <div class="alert small">비밀번호를 잊으면 되찾을 수 없으니 안전한 곳에 적어 두세요.</div>
  </div>

  <div class="pane hidden" data-step="2">
    <div><h1>어떻게 시작할까요?</h1><p class="muted" style="margin:0">샘플은 나중에 버튼 하나로 지울 수 있습니다.</p></div>
    <label class="choice"><input type="radio" name="start" value="sample" checked><span><b>샘플로 먼저 둘러보기</b><span class="small muted">가상의 교육생 11명과 공개 교육 영상 1개를 넣어 줍니다. 처음이라면 추천합니다.</span></span></label>
    <label class="choice"><input type="radio" name="start" value="empty"><span><b>바로 실제 운영 준비</b><span class="small muted">빈 상태로 시작해 회사 과정과 명부를 직접 등록합니다.</span></span></label>
  </div>

  <div class="acts"><button type="button" class="btn hidden" id="back">이전</button><button class="btn primary lg" id="next">다음</button></div>
</form>
<script src="/common.js"></script>
<script>
  let step = 0;
  const form = $('#f');
  const show = () => {
    $$('.pane').forEach((p) => p.classList.toggle('hidden', Number(p.dataset.step) !== step));
    $$('.steps i').forEach((b, i) => b.classList.toggle('on', i <= step));
    $('#back').classList.toggle('hidden', step === 0);
    $('#next').textContent = step === 2 ? '시작하기' : '다음';
    const first = $(`.pane[data-step="${step}"] input`); if (first) first.focus();
  };
  const check = () => {
    if (step === 0 && (!form.company_name.value.trim() || !form.ceo_name.value.trim())) return '회사명과 대표이사 성명을 입력하세요.';
    if (step === 1) {
      const pw = form.password.value;
      if (pw.length < 8 || !/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return '비밀번호는 영문과 숫자를 포함해 8자 이상이어야 합니다.';
      if (pw !== form.confirm.value) return '비밀번호 확인이 일치하지 않습니다.';
    }
    return '';
  };
  $('#back').onclick = () => { step--; show(); };
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const problem = check();
    if (problem) return toast(problem, 'error');
    if (step < 2) { step++; return show(); }
    const btn = $('#next'); btn.disabled = true;
    try {
      await api('POST', '/api/setup', { company_name: form.company_name.value, ceo_name: form.ceo_name.value, manager_contact: form.manager_contact.value, password: form.password.value, sample: form.start.value === 'sample' });
      location.href = '/admin#start';
    } catch (err) { toast(err.message, 'error'); btn.disabled = false; }
  });
  api('GET', '/api/setup').then((s) => {
    if (!s.needed) { location.href = '/'; return; }
    if (!s.local) form.innerHTML = '<div class="brand"><div class="brand-mark">法</div><span>법정필수교육 LMS</span></div><h1>설정이 아직 끝나지 않았습니다</h1><p class="muted" style="margin:0">최초 설정은 보안을 위해 <b>LMS가 실행 중인 PC</b>에서만 할 수 있습니다. 그 PC의 브라우저에서 <b>http://localhost:3000</b> 을 열어 주세요.</p>';
  });
  show();
</script>
</body>
</html>
