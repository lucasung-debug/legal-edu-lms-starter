<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>법정교육 HR 관리</title>
<link rel="stylesheet" href="/app.css">
<style>
  body { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  aside { background: #111a2e; color: #c9d2e3; padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
  aside .brand { color: #fff; padding: 4px 10px 18px; }
  aside a { display: flex; gap: 10px; align-items: center; color: inherit; padding: 9px 12px; border-radius: 8px; font-weight: 600; }
  aside a:hover { background: rgba(255,255,255,.06); }
  aside a.on { background: #2f5bea; color: #fff; }
  aside .foot { margin-top: auto; padding: 10px; font-size: 12px; color: #8b97ad; display: grid; gap: 8px; }
  aside .foot .btn { background: transparent; color: #c9d2e3; border-color: #2c3854; }
  .page { padding: 24px 28px 60px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-content: start; min-width: 0; }
  .page-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .kpi { padding: 16px 18px; }
  .kpi .label { color: var(--muted); font-size: 12px; font-weight: 600; }
  .kpi .value { font-size: 26px; font-weight: 800; margin-top: 4px; }
  .kpi .sub { font-size: 12px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .hbar { display: grid; grid-template-columns: minmax(120px, 200px) 1fr 52px; gap: 10px; align-items: center; padding: 7px 0; }
  .hbar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stack { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: #edf0f5; }
  .stack i { display: block; height: 100%; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .cell { display: inline-grid; place-items: center; min-width: 44px; height: 24px; border-radius: 6px; font-size: 12px; font-weight: 700; }
  .cell.done { background: var(--success-weak); color: var(--success); }
  .cell.part { background: var(--primary-weak); color: var(--primary); }
  .cell.none { background: #f1f3f7; color: #9aa3b2; }
  .cell.bad { background: var(--danger-weak); color: var(--danger); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters input, .filters select { width: auto; min-width: 140px; }
  .seal-preview { width: 96px; height: 96px; border: 1px dashed var(--line); border-radius: 10px; display: grid; place-items: center; overflow: hidden; background: var(--surface-2); }
  .seal-preview img { max-width: 100%; max-height: 100%; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-weight: 500; }
  .chip input { width: auto; }
  .step { display: grid; grid-template-columns: 34px 1fr auto; gap: 14px; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .step:last-child { border-bottom: 0; }
  .step .no { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: #edf0f5; color: var(--muted); }
  .step.done .no { background: var(--success-weak); color: var(--success); }
  .step p { margin: 2px 0 0; }
  .notice { white-space: pre-line; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; font-size: 13px; }
  .upload-bar { height: 8px; border-radius: 999px; background: #edf0f5; overflow: hidden; }
  .upload-bar i { display: block; height: 100%; width: 0; background: var(--primary); transition: width .2s; }
  @media (max-width: 960px) {
    body { grid-template-columns: 1fr; }
    aside { position: static; height: auto; flex-direction: row; flex-wrap: wrap; }
    aside .brand, aside .foot { display: none; }
    .grid2 { grid-template-columns: 1fr; }
    .page { padding: 16px; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="brand-mark">法</div><span>HR 교육관리</span></div>
  <a href="#start" data-tab="start">🚀 시작하기</a>
  <a href="#dashboard" data-tab="dashboard">📊 대시보드</a>
  <a href="#users" data-tab="users">👥 교육생 명부</a>
  <a href="#courses" data-tab="courses">🎬 교육 과정</a>
  <a href="#completion" data-tab="completion">✅ 수료율 관리</a>
  <a href="#reminders" data-tab="reminders">🔔 알림·독촉</a>
  <a href="#certificates" data-tab="certificates">🏅 수료증 관리</a>
  <a href="#settings" data-tab="settings">⚙️ 설정</a>
  <div class="foot">
    <span id="who"></span>
    <button class="btn sm" id="pwBtn">비밀번호 변경</button>
    <button class="btn sm" onclick="logout()">로그아웃</button>
  </div>
</aside>
<main class="page" id="page"></main>
<script src="/common.js"></script>
<script src="/admin.js"></script>
</body>
</html>
